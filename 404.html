<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>...</title>
  <script>
    // /end/16자리 형태의 접근인 경우 end/index.html로 즉시 리다이렉트
    const currentPath = window.location.pathname;
    if (currentPath.includes('/end/')) {
      const code = currentPath.split('/end/')[1];
      if (code && code.length > 0) {
        window.location.href = '/end/?code=' + code;
      }
    }
  </script>
  <style>
    body {
      background-color: #000;
      color: #3b82f6;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      user-select: none;
      overflow: hidden;
    }
    #text-zone {
      font-size: 1.4rem;
      text-align: center;
      line-height: 1.8;
      white-space: pre-wrap;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.2rem;
      background-color: #3b82f6;
      margin-left: 5px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="text-zone"></div>

  <script>
    const textZone = document.getElementById('text-zone');
    
    const pathSegments = currentPath.split('/').filter(Boolean);
    const wrongPathName = pathSegments.length > 0 ? pathSegments[pathSegments.length - 1] : "알 수 없는 경로";

    let wrongCount = parseInt(localStorage.getItem('wrongsite') || '0', 10);
    let scriptLines = [];

    if (wrongCount === 0) {
      // 1회차 (wrongsite: 0 -> 1)
      scriptLines = [
        "잘못된 경로 같군요...",
        `{${wrongPathName}} 는...`,
        "잘못된 주소에요..."
      ];
      localStorage.setItem('wrongsite', '1');

    } else if (wrongCount === 1) {
      // 2회차 (wrongsite: 1 -> 2)
      scriptLines = [
        "흠...",
        "아직 어려우신것 같네요",
        "다시 도전해보세요..."
      ];
      localStorage.setItem('wrongsite', '2');

    } else if (wrongCount === 2) {
      // 3회차 (wrongsite: 2 -> 3)
      scriptLines = [
        "또 길을 잃으셨나요?",
        "C:\\ 디렉터리의 근본부터...",
        "차근차근 들여다보세요..."
      ];
      localStorage.setItem('wrongsite', '3');

    } else {
      // 4회차 이상 (wrongsite >= 3 고정 무한 반복)
      scriptLines = [
        "이런... 제 대사를 보고 싶은건가요",
        "이제는 이 대사를 반복할 겁니다..",
        "실수하지 마세요..",
        "그리고 다시 도전하세요.."
      ];
      localStorage.setItem('wrongsite', '3');
    }

    function typeText(text) {
      return new Promise((resolve) => {
        let index = 0;
        textZone.innerHTML = '<span id="typed"></span><span class="cursor"></span>';
        const typedSpan = document.getElementById('typed');

        const timer = setInterval(() => {
          typedSpan.textContent += text[index];
          index++;
          if (index >= text.length) {
            clearInterval(timer);
            resolve();
          }
        }, 500);
      });
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function startGuidingLight() {
      await sleep(1000);

      for (let i = 0; i < scriptLines.length; i++) {
        await typeText(scriptLines[i]);
        await sleep(3000);
      }

      // 대사 종료 후 7초 대기 ➔ 루트 메인 이동
      await sleep(7000);
      window.location.href = "http://arc-lev-0.kro.kr/";
    }

    startGuidingLight();
  </script>
</body>
</html>
