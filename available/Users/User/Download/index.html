<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>C:\Users\User\Download의 색인</title>
  <style>
    body { background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 20px 40px; }
    h1 { font-size: 2rem; }
    ul { list-style: none; padding: 0; font-size: 1.05rem; }
    li { margin: 12px 0; }
    a { color: #fff; text-decoration: underline; cursor: pointer; }
    a:hover { color: #8ab4f8; }

    #viewer-box {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 880px;
      background-color: #111;
      border: 1px solid #fff;
      padding: 15px 20px;
    }
    #viewer-title { font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 10px; color: #8ab4f8; display: flex; justify-content: space-between; }
    #viewer-content { font-family: monospace; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.4; }
    .close-btn { cursor: pointer; color: #ff5555; }
  </style>
</head>
<body>

  <div id="content" style="display: none;">
    <h1>Index of /Users/User/Download/</h1>
    <ul>
      <li><a onclick="showContent('Patch_v1.02.exe', '[실행 불가능]\n이 파일은 손상되었거나 호환되지 않는 아키텍처입니다.')">📄 Patch_v1.02.exe</a></li>
      <li><a onclick="showContent('secret_archive.zip', '압축 파일 내용물:\n- key_fragment.dat (암호 필요)\n- next_target.url (손상됨)')">📄 secret_archive.zip</a></li>
      <li><a onclick="showContent('memo.log', '2026-09-08 23:11:00 - 외부 IP에서 접근 시도 감지됨.\n포트: 8080')">📄 memo.log</a></li>
    </ul>

    <div id="viewer-box">
      <div id="viewer-title">
        <span id="file-title">FILE</span>
        <span class="close-btn" onclick="closeViewer()">[X] CLOSE</span>
      </div>
      <div id="viewer-content"></div>
    </div>
  </div>

  <script>
    // 보안 검증 (직접 접근 차단)
    (function() {
      if (localStorage.getItem('user_unlocked') === 'true') {
        document.getElementById('content').style.display = 'block';
      } else {
        alert("접근 권한이 없습니다.");
        window.location.href = "../../";
      }
    })();

    function showContent(title, text) {
      document.getElementById('file-title').innerText = title;
      document.getElementById('viewer-content').innerText = text;
      document.getElementById('viewer-box').style.display = 'block';
    }
    function closeViewer() {
      document.getElementById('viewer-box').style.display = 'none';
    }
  </script>
</body>
</html>
