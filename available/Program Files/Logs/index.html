<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>C:\Program Files\Logs의 색인</title>
  <style>
    body { background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 20px 40px; }
    h1 { font-size: 2rem; }
    ul { list-style: none; padding: 0; font-size: 1.05rem; }
    li { margin: 12px 0; }
    a { color: #fff; text-decoration: underline; cursor: pointer; }
    a:hover { color: #8ab4f8; }

    #viewer-box {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 880px;
      background-color: #111;
      border: 1px solid #fff;
      padding: 15px 20px;
    }
    #viewer-title { font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 10px; color: #8ab4f8; display: flex; justify-content: space-between; }
    #viewer-content { font-family: monospace; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.4; }
    .close-btn { cursor: pointer; color: #ff5555; }
  </style>
</head>
<body>

  <div id="content" style="display: none;">
    <h1>Index of /Program Files/Logs/</h1>
    <ul>
      <li><a onclick="showContent('system_memo.log', '&quot;Program Files&quot; derectory is connected.\nC:\\boot is next.\nBut...\n...\nIt has security. you should recovery it first.\n\nYou came here hard.\nbut everything you\'ve done so far was just preparation.\n\nGood Luck!')">📄 system_memo.log</a></li>
    </ul>

    <div id="viewer-box">
      <div id="viewer-title">
        <span id="file-title">FILE</span>
        <span class="close-btn" onclick="closeViewer()">[X] CLOSE</span>
      </div>
      <div id="viewer-content"></div>
    </div>
  </div>

  <script>
    (function() {
      if (localStorage.getItem('pf_unlocked') === 'true') {
        document.getElementById('content').style.display = 'block';
      } else {
        alert("접근 권한이 없습니다.");
        window.location.href = "../../";
      }
    })();

    function showContent(title, text) {
      document.getElementById('file-title').innerText = title;
      document.getElementById('viewer-content').innerText = text;
      document.getElementById('viewer-box').style.display = 'block';
    }
    function closeViewer() {
      document.getElementById('viewer-box').style.display = 'none';
    }
  </script>
</body>
</html>
