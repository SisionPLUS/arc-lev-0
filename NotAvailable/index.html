<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Not Available</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: monospace, sans-serif;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .main-text {
      font-size: 2rem;
      letter-spacing: 2px;

    .hidden-text {
      color: #000;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="main-text">Not Available</div>
  <div class="hidden-text">really</div>

</body>
</html>
